name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build LAMPA plugin
        run: npm run build

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: lampa-3d-movies
          path: dist/lampa-3d-movies.js
          if-no-files-found: error
