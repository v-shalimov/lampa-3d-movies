name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build LAMPA plugin
        run: npm run build

      - name: Publish installable plugin on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/lampa-3d-movies.js
          if ! git diff --cached --quiet; then
            git commit -m "build: publish LAMPA plugin bundle"
            git push
          fi

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: lampa-3d-movies
          path: dist/lampa-3d-movies.js
          if-no-files-found: error
